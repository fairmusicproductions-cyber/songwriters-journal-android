
name: Build Songwriters Journal Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Android SDK paths
        run: |
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Install Node.js dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Sync application files
        run: npx cap sync android

      - name: Add microphone permission
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          permission = '<uses-permission android:name="android.permission.RECORD_AUDIO" />'

          if 'android.permission.RECORD_AUDIO' not in text:
              if '<application' not in text:
                  raise SystemExit('Application element not found in AndroidManifest.xml')
              text = text.replace('<application', permission + '\n    <application', 1)
              manifest.write_text(text)
          PY

      - name: Enable microphone recording in Android WebView
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path

          activity = Path('android/app/src/main/java/com/fairmusicproductions/songwritersjournal/MainActivity.java')
          if not activity.exists():
              raise SystemExit(f'MainActivity not found: {activity}')

          activity.write_text(r'''package com.fairmusicproductions.songwritersjournal;

          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.os.Bundle;
          import android.util.Log;
          import android.webkit.PermissionRequest;
          import androidx.annotation.NonNull;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.BridgeActivity;
          import com.getcapacitor.BridgeWebChromeClient;

          public class MainActivity extends BridgeActivity {
              private static final String TAG = "JournalMicrophone";
              private static final int MIC_REQUEST = 1001;
              private PermissionRequest pendingWebRequest;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  // Preserve Capacitor's handling of file inputs and other WebView features.
                  bridge.getWebView().setWebChromeClient(new BridgeWebChromeClient(bridge) {
                      @Override
                      public void onPermissionRequest(PermissionRequest request) {
                          runOnUiThread(() -> handleWebPermission(request));
                      }

                      @Override
                      public void onPermissionRequestCanceled(PermissionRequest request) {
                          runOnUiThread(() -> {
                              if (pendingWebRequest == request) pendingWebRequest = null;
                          });
                      }
                  });
              }

              private void handleWebPermission(PermissionRequest request) {
                  boolean wantsAudio = false;
                  for (String resource : request.getResources()) {
                      if (PermissionRequest.RESOURCE_AUDIO_CAPTURE.equals(resource)) {
                          wantsAudio = true;
                      }
                  }
                  if (!wantsAudio) {
                      Log.w(TAG, "WebView requested unsupported resources");
                      request.deny();
                      return;
                  }

                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO)
                          == PackageManager.PERMISSION_GRANTED) {
                      Log.i(TAG, "Granting WebView audio capture");
                      request.grant(new String[]{PermissionRequest.RESOURCE_AUDIO_CAPTURE});
                  } else {
                      Log.i(TAG, "Requesting Android microphone permission");
                      if (pendingWebRequest != null && pendingWebRequest != request) {
                          pendingWebRequest.deny();
                      }
                      pendingWebRequest = request;
                      ActivityCompat.requestPermissions(this,
                          new String[]{Manifest.permission.RECORD_AUDIO}, MIC_REQUEST);
                  }
              }

              @Override
              public void onRequestPermissionsResult(int requestCode,
                      @NonNull String[] permissions, @NonNull int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode != MIC_REQUEST) return;

                  PermissionRequest request = pendingWebRequest;
                  pendingWebRequest = null;
                  if (request == null) return;

                  boolean granted = grantResults.length > 0
                      && grantResults[0] == PackageManager.PERMISSION_GRANTED;
                  Log.i(TAG, "Android microphone permission granted: " + granted);
                  if (granted) {
                      request.grant(new String[]{PermissionRequest.RESOURCE_AUDIO_CAPTURE});
                  } else {
                      request.deny();
                  }
              }
          }
          ''')
          PYCODE

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Songwriters-Journal-Android-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
