
name: Build Songwriters Journal Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Android SDK paths
        run: |
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Install Node.js dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Sync application files
        run: npx cap sync android

      - name: Add microphone permission
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          permission = '<uses-permission android:name="android.permission.RECORD_AUDIO" />'

          if permission not in text:
              text = text.replace(
                  '<application',
                  permission + '\n    <application',
                  1
              )
              manifest.write_text(text)
          PY

      - name: Enable microphone recording in Android WebView
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/java/com/fairmusicproductions/songwritersjournal/MainActivity.java")
          path.parent.mkdir(parents=True, exist_ok=True)

          path.write_text("""package com.fairmusicproductions.songwritersjournal;

          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.os.Bundle;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              private PermissionRequest pendingRequest;
              private static final int MIC_REQUEST = 1001;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getBridge().getWebView().setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onPermissionRequest(PermissionRequest request) {
                          runOnUiThread(() -> {
                              boolean audioRequested = false;
                              for (String resource : request.getResources()) {
                                  if (PermissionRequest.RESOURCE_AUDIO_CAPTURE.equals(resource)) {
                                      audioRequested = true;
                                  }
                              }

                              if (!audioRequested) {
                                  request.deny();
                                  return;
                              }

                              if (ContextCompat.checkSelfPermission(
                                      MainActivity.this, Manifest.permission.RECORD_AUDIO)
                                      == PackageManager.PERMISSION_GRANTED) {
                                  request.grant(new String[]{PermissionRequest.RESOURCE_AUDIO_CAPTURE});
                              } else {
                                  pendingRequest = request;
                                  ActivityCompat.requestPermissions(
                                      MainActivity.this,
                                      new String[]{Manifest.permission.RECORD_AUDIO},
                                      MIC_REQUEST
                                  );
                              }
                          });
                      }
                  });
              }

              @Override
              public void onRequestPermissionsResult(
                      int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);

                  if (requestCode == MIC_REQUEST && pendingRequest != null) {
                      PermissionRequest request = pendingRequest;
                      pendingRequest = null;

                      if (grantResults.length > 0 &&
                              grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                          request.grant(new String[]{PermissionRequest.RESOURCE_AUDIO_CAPTURE});
                      } else {
                          request.deny();
                      }
                  }
              }
          }
          """)
          PY

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Songwriters-Journal-Android-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
